[project]
name = "callmemaybe"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "numpy",
    "tqdm>=4.68.3",
    "llm-sdk"
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.1.0",
    "types-tqdm>=4.68.0.20260608",
]
